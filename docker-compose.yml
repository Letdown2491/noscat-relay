services:
  noscat-relay:
    build: .
    container_name: noscat-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:3340:3340"
    # Configuration comes from .env (copy .env.example to .env).
    env_file:
      - path: .env
        required: false
    environment:
      # Container-specific: listen on all interfaces inside the container and
      # keep data in the volume. In a container MEMBERS_COMMAND cannot reach a
      # noscat on the host; use MEMBERS_FILE with a mounted file instead.
      RELAY_PORT: ":3340"
      WORKING_DIR: "/app/data"
    volumes:
      - noscat_relay_data:/app/data

volumes:
  noscat_relay_data:
